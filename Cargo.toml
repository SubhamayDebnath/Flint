[package]
name = "flint"
version = "0.3.0"
description = "Instant, offline, keyboard-first Windows launcher (100% native Rust)"
authors = ["subhamay"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[[bin]]
name = "flint"
path = "src/main.rs"

[dependencies]
# Native GUI: egui + OpenGL (glow). No browser, no WebView2, no JavaScript.
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
egui-phosphor = "0.14"
raw-window-handle = "0.6"
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
tray-icon = { version = "0.26", default-features = false }
window-vibrancy = "0.8"
winreg = "0.55"
walkdir = "2"
rayon = "1"
png = "0.17"
parking_lot = "0.12"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
